name: Issue readiness

# Enforces the agent:ready gate. When agent:ready is added to an issue, verify
# the issue actually contains the sections an agent needs to work safely. If it
# does not, remove agent:ready, apply needs:decision, and comment with what is
# missing — so an underspecified issue can never authorize implementation.
#
# Uses gh + the built-in GITHUB_TOKEN. No third-party actions.

on:
  issues:
    types: [labeled]

permissions:
  issues: write

jobs:
  check:
    # Only react to the agent:ready label being added.
    if: github.event.label.name == 'agent:ready'
    runs-on: ubuntu-latest
    steps:
      - name: Validate required sections
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail

          # Pull the body from the event payload (preserves multiline safely).
          jq -r '.issue.body // ""' "$GITHUB_EVENT_PATH" > body.txt

          # Each entry: "Human label|regex that satisfies it" (case-insensitive).
          declare -a checks=(
            "Problem|problem"
            "Desired outcome|desired outcome|outcome"
            "Acceptance criteria|acceptance criteria"
            "Scope|scope"
            "Definition of done|definition of done|completion criteria"
          )

          missing=()
          for entry in "${checks[@]}"; do
            label="${entry%%|*}"
            pattern="${entry#*|}"
            if ! grep -Eiq "$pattern" body.txt; then
              missing+=("$label")
            fi
          done

          if [ ${#missing[@]} -eq 0 ]; then
            echo "Issue #$ISSUE_NUMBER is ready: all required sections present."
            exit 0
          fi

          echo "Issue #$ISSUE_NUMBER is missing: ${missing[*]}"

          # Build the checklist for the comment.
          list=""
          for m in "${missing[@]}"; do
            list="${list}- ${m}"$'\n'
          done

          gh issue edit "$ISSUE_NUMBER" --remove-label "agent:ready" --add-label "needs:decision"

          # Build the comment body into a file (avoids YAML/heredoc indent conflicts).
          {
            echo "### \`agent:ready\` removed — issue is underspecified"
            echo ""
            echo "An agent may only start an issue that documents the essentials. This issue is missing:"
            echo ""
            printf '%s' "$list"
            echo ""
            echo "Please add the missing sections, then re-apply \`agent:ready\`. See \`docs/project-management/agent-workflow.md\` and \`docs/project-management/issue-lifecycle.md\`."
            echo ""
            echo "---"
            echo "_Generated by [Claude Code](https://claude.ai/code)_"
          } > agent-ready-comment.md

          gh issue comment "$ISSUE_NUMBER" --body-file agent-ready-comment.md
