name: CI

# Deterministic checks for the web app. The steps are guarded on the presence
# of apps/web/package.json so this workflow is honest on any branch: it runs the
# real install/lint/typecheck/test/build only when the app actually exists, and
# no-ops (green) before then. No placeholder or fake commands.

on:
  pull_request:
  push:
    branches: [main, claude/ecommerce-toolkit-project-os-282zd7]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Detect web app
        id: detect
        run: |
          if [ -f apps/web/package.json ]; then
            echo "has_app=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_app=false" >> "$GITHUB_OUTPUT"
            echo "apps/web not present on this ref — skipping web checks."
          fi

      - name: Setup Node
        if: steps.detect.outputs.has_app == 'true'
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # Turborepo monorepo (ADR-009): install once from the root (single hoisted
      # lockfile), then run each task through Turbo from the repo root.
      - name: Install
        if: steps.detect.outputs.has_app == 'true'
        run: npm ci

      - name: Lint
        if: steps.detect.outputs.has_app == 'true'
        run: npm run lint

      - name: Format check
        if: steps.detect.outputs.has_app == 'true'
        run: npm run format

      - name: Typecheck
        if: steps.detect.outputs.has_app == 'true'
        run: npm run typecheck

      - name: Unit tests
        if: steps.detect.outputs.has_app == 'true'
        run: npm test

      - name: Build
        if: steps.detect.outputs.has_app == 'true'
        run: npm run build

      - name: Browser tests
        if: steps.detect.outputs.has_app == 'true'
        # Run from the app: the Playwright binary and its config live there
        # (workspace-dep bins are not hoisted to the root node_modules/.bin).
        working-directory: apps/web
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium
          # The app's playwright.config prefers CHROMIUM_PATH; point it at the
          # Playwright-managed browser installed above (the pinned /opt path
          # only exists in the Claude Code environment, not on CI runners).
          CHROMIUM_PATH="$(find "$HOME/.cache/ms-playwright" -type f -name chrome -path '*chrome-linux*' | head -1)"
          echo "Using Chromium at: ${CHROMIUM_PATH:-<default>}"
          CHROMIUM_PATH="$CHROMIUM_PATH" npm run test:e2e

      - name: Upload Playwright report
        if: ${{ always() && steps.detect.outputs.has_app == 'true' }}
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  # Deploy to production only on main branch if the build succeeded
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: web
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Write deploy key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Validate deploy key
        run: |
          if ! ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null; then
            echo "::error::DEPLOY_SSH_KEY secret is not a valid private key (failed to parse)." \
                 "Re-upload it with 'gh secret set DEPLOY_SSH_KEY < path/to/key' to avoid newline/formatting corruption."
            exit 1
          fi

      - name: Deploy via SSH (3 attempts, 20 s apart)
        # GitHub Actions runners rotate across a large Azure IP pool. Some IPs are
        # blocked by the server firewall (i/o timeout = silent DROP, not REJECT).
        # Retry up to 3 times; each attempt gets the same runner/IP so we also add
        # a short sleep to let any transient block expire before the next try.
        run: |
          for attempt in 1 2 3; do
            echo "=== Deploy attempt $attempt/3 ==="
            if ssh \
              -i ~/.ssh/deploy_key \
              -o ConnectTimeout=30 \
              -o ServerAliveInterval=10 \
              -o ServerAliveCountMax=3 \
              -o StrictHostKeyChecking=no \
              -o BatchMode=yes \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              '/var/www/toolkit/deploy.sh'; then
              echo "Deploy succeeded on attempt $attempt"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Attempt $attempt failed — waiting 20s before retry..."
              sleep 20
            fi
          done
          echo "All 3 deploy attempts failed"
          exit 1
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}

      - name: Remove deploy key
        if: always()
        run: rm -f ~/.ssh/deploy_key
