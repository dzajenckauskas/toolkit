name: CI

# Deterministic checks for the web app. The steps are guarded on the presence
# of apps/web/package.json so this workflow is honest on any branch: it runs the
# real install/lint/typecheck/test/build only when the app actually exists, and
# no-ops (green) before then. No placeholder or fake commands.

on:
  pull_request:
  push:
    branches: [main, claude/ecommerce-toolkit-project-os-282zd7]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Detect web app
        id: detect
        run: |
          if [ -f apps/web/package.json ]; then
            echo "has_app=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_app=false" >> "$GITHUB_OUTPUT"
            echo "apps/web not present on this ref — skipping web checks."
          fi

      - name: Setup Node
        if: steps.detect.outputs.has_app == 'true'
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        if: steps.detect.outputs.has_app == 'true'
        working-directory: apps/web
        run: npm ci

      - name: Lint
        if: steps.detect.outputs.has_app == 'true'
        working-directory: apps/web
        run: npm run lint

      - name: Format check
        if: steps.detect.outputs.has_app == 'true'
        working-directory: apps/web
        run: npm run format

      - name: Typecheck
        if: steps.detect.outputs.has_app == 'true'
        working-directory: apps/web
        run: npm run typecheck

      - name: Unit tests
        if: steps.detect.outputs.has_app == 'true'
        working-directory: apps/web
        run: npm test

      - name: Build
        if: steps.detect.outputs.has_app == 'true'
        working-directory: apps/web
        run: npm run build

      - name: Browser tests
        if: steps.detect.outputs.has_app == 'true'
        working-directory: apps/web
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium
          # The app's playwright.config prefers CHROMIUM_PATH; point it at the
          # Playwright-managed browser installed above (the pinned /opt path
          # only exists in the Claude Code environment, not on CI runners).
          CHROMIUM_PATH="$(find "$HOME/.cache/ms-playwright" -type f -name chrome -path '*chrome-linux*' | head -1)"
          echo "Using Chromium at: ${CHROMIUM_PATH:-<default>}"
          CHROMIUM_PATH="$CHROMIUM_PATH" npm run test:e2e

      - name: Upload Playwright report
        if: ${{ always() && steps.detect.outputs.has_app == 'true' }}
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
