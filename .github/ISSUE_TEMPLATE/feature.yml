name: Feature
description: Define a focused product or technical feature
title: "[Feature]: "
labels: ["feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or project problem does this solve?
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the observable result, not only the implementation.
    validations:
      required: true

  - type: dropdown
    id: stage
    attributes:
      label: Current stage
      options:
        - Discovery
        - Specification
        - Design
        - Development
        - Testing
        - Release
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - MVP
        - Post-MVP
        - Research
    validations:
      required: true

  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Notes and constraints
